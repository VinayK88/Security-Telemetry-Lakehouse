<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Security Telemetry Lakehouse dashboard preview</title><desc id="desc">Static synthetic dashboard preview for security telemetry ingestion, data quality, features, and findings.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151b"/><stop offset="1" stop-color="#12313b"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="29" font-weight="800" fill="#f8fafc">Security Telemetry Lakehouse</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#67e8f9">NORMALIZE · DEDUPLICATE · WATERMARK · AGGREGATE · DETECT</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#0d232b" stroke="#2e5662"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">SCHEMA</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">CANONICAL</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0d232b" stroke="#2e5662"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">DELIVERY</text><text x="343" y="184" font-size="24" font-weight="800" fill="#5eead4">IDEMPOTENT</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0d232b" stroke="#2e5662"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">FEATURES</text><text x="618" y="184" font-size="24" font-weight="800" fill="#93c5fd">WINDOWED</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0d232b" stroke="#2e5662"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">FINDINGS</text><text x="893" y="184" font-size="24" font-weight="800" fill="#fbbf24">EXPLAINABLE</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0b1b22" stroke="#2e5662"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Pipeline health</text><text x="72" y="298" font-size="12" fill="#94a3b8">Data quality is visible before analytics</text><rect x="72" y="332" width="438" height="42" rx="10" fill="#102c30"/><text x="90" y="359" font-size="13" font-weight="750" fill="#5eead4">VALIDATE + NORMALIZE</text><rect x="72" y="388" width="438" height="42" rx="10" fill="#15243a"/><text x="90" y="415" font-size="13" font-weight="750" fill="#93c5fd">DEDUPLICATE + EVENT-TIME WATERMARK</text><rect x="72" y="444" width="438" height="42" rx="10" fill="#211c38"/><text x="90" y="471" font-size="13" font-weight="750" fill="#c4b5fd">RAW STORE + HOURLY ENTITY FEATURES</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0b1b22" stroke="#2e5662"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Analyst signal layer</text><text x="631" y="298" font-size="12" fill="#94a3b8">Transparent reasons instead of opaque alert labels</text><circle cx="637" cy="347" r="6" fill="#f59e0b"/><text x="655" y="352" font-size="14" font-weight="650" fill="#dbeafe">Failed-login volume and source-IP diversity</text><circle cx="637" cy="395" r="6" fill="#60a5fa"/><text x="655" y="400" font-size="14" font-weight="650" fill="#dbeafe">Sensitive actions and average event risk</text><circle cx="637" cy="443" r="6" fill="#5eead4"/><text x="655" y="448" font-size="14" font-weight="650" fill="#dbeafe">Late events, duplicates and dead-letter visibility</text><circle cx="637" cy="491" r="6" fill="#a78bfa"/><text x="655" y="496" font-size="14" font-weight="650" fill="#dbeafe">Replayable normalized evidence for detection review</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview represents deterministic synthetic telemetry and local-demo contracts; no live security environment is connected.</text></g></svg>