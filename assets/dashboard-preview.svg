<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity=".05"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}.i{fill:#1d1d1f}.m{fill:#6e6e73}.b{fill:#0071e3}.l{font-size:11px;font-weight:700;letter-spacing:1px;fill:#86868b}.v{font-size:25px;font-weight:650;letter-spacing:-.8px;fill:#1d1d1f}.card{fill:#f5f5f7;stroke:#e8e8ed}.sec{font-size:20px;font-weight:650;letter-spacing:-.5px;fill:#1d1d1f}</style></defs><rect width="1200" height="640" rx="28" fill="#fff"/><text x="50" y="50" class="b" font-size="12" font-weight="700" letter-spacing="1.6">SECURITY TELEMETRY LAKEHOUSE</text><text x="50" y="94" class="i" font-size="36" font-weight="650" letter-spacing="-1.5">Clean telemetry. Better detections.</text><text x="50" y="123" class="m" font-size="14">Normalize, deduplicate, watermark, aggregate, and preserve explainable evidence for downstream security analytics.</text><rect x="940" y="45" width="210" height="36" rx="18" fill="#f5f5f7"/><circle cx="960" cy="63" r="5" fill="#34c759"/><text x="975" y="67" class="i" font-size="11" font-weight="650">Synthetic pipeline healthy</text><g filter="url(#s)"><rect class="card" x="50" y="158" width="255" height="100" rx="24"/><rect class="card" x="320" y="158" width="255" height="100" rx="24"/><rect class="card" x="590" y="158" width="255" height="100" rx="24"/><rect class="card" x="860" y="158" width="290" height="100" rx="24"/></g><text x="72" y="188" class="l">SCHEMA</text><text x="72" y="228" class="v">Canonical</text><text x="342" y="188" class="l">DELIVERY</text><text x="342" y="228" class="v">Idempotent</text><text x="612" y="188" class="l">FEATURES</text><text x="612" y="228" class="v">Windowed</text><text x="882" y="188" class="l">FINDINGS</text><text x="882" y="228" class="v">Explainable</text><rect x="50" y="290" width="525" height="278" rx="28" class="card"/><text x="76" y="328" class="sec">Pipeline health</text><text x="76" y="352" class="m" font-size="13">Data quality is visible before analytics.</text><rect x="76" y="385" width="430" height="42" rx="14" fill="#fff"/><text x="96" y="411" class="i" font-size="13" font-weight="650">Validate + normalize</text><rect x="76" y="440" width="430" height="42" rx="14" fill="#fff"/><text x="96" y="466" class="i" font-size="13" font-weight="650">Deduplicate + event-time watermark</text><rect x="76" y="495" width="430" height="42" rx="14" fill="#fff"/><text x="96" y="521" class="i" font-size="13" font-weight="650">Raw store + hourly entity features</text><rect x="595" y="290" width="555" height="278" rx="28" class="card"/><text x="621" y="328" class="sec">Analyst signal layer</text><text x="621" y="352" class="m" font-size="13">Transparent reasons instead of opaque alert labels.</text><circle cx="628" cy="398" r="5" fill="#0071e3"/><text x="646" y="403" class="i" font-size="13">Failed-login volume and source-IP diversity</text><circle cx="628" cy="443" r="5" fill="#0071e3" opacity=".82"/><text x="646" y="448" class="i" font-size="13">Sensitive actions and average event risk</text><circle cx="628" cy="488" r="5" fill="#0071e3" opacity=".64"/><text x="646" y="493" class="i" font-size="13">Late events, duplicates and dead-letter visibility</text><circle cx="628" cy="533" r="5" fill="#0071e3" opacity=".46"/><text x="646" y="538" class="i" font-size="13">Replayable normalized evidence for detection review</text><text x="50" y="608" class="m" font-size="11">Deterministic synthetic telemetry only · no live security environment connected</text></svg>